[package]
name = "netwatch-tui"
version = "0.35.3"
edition = "2021"
authors = ["Matt Hartley <matthew.t.hartley@gmail.com>"]
description = "Real-time network diagnostics in your terminal. One command, zero config, instant visibility."
license = "MIT"
repository = "https://github.com/matthart1983/netwatch"
homepage = "https://github.com/matthart1983/netwatch"
readme = "README.md"
keywords = ["network", "tui", "terminal", "packet-capture", "diagnostics"]
categories = ["command-line-utilities", "network-programming"]
exclude = [
    ".DS_Store",
    # Demo recordings and their vhs tapes. Kept in the repo for the README,
    # excluded from the published crate — crates.io has a 10 MiB limit and
    # these are most of the repo's bytes.
    "docs/media/",
    # Per-tab screen captures, same reasoning: 2.8 MiB of documentation assets
    # that a `cargo install` has no use for.
    "screenshots/",
    "*.mov",
    "*.cast",
]

[lib]
name = "netwatch"
path = "src/lib.rs"

[[bin]]
name = "netwatch"
path = "src/main.rs"

[dependencies]
ratatui = "0.27"
crossterm = "0.27"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
anyhow = "1"
chrono = "0.4"
pcap = "2"
# Deep packet inspection: TLS ClientHello / SNI extraction (rusticata / Suricata folks)
# and HTTP request line parsing. Both small, well-maintained, permissive-licensed.
tls-parser = "0.12"
httparse = "1.10"
# Developer target probes time the TLS handshake themselves and need the
# certificate error class, which ureq hides. Both are already in the tree
# through ureq with these features, so this adds no new crates.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
webpki-roots = "0.26"
# QUIC Initial decryption (Phase 9 hard mode) uses ring's `aead::quic`
# header-protection primitive + `aead::AES_128_GCM` + the `hkdf` module.
# ring is already a direct dep above for TLS work.
socket2 = { version = "0.6", features = ["all"] }
url = "2"
ureq = { version = "2", features = ["json"] }
uuid = { version = "1", features = ["v4", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
toml = "0.8"
toml_edit = "0.22"
dirs = "5"
# Display-width-aware truncation for the Lite view's fixed character grid.
# Byte or char length would misalign columns on CJK process names. Already in
# the tree as a transitive dep of ratatui.
unicode-width = "0.1"
maxminddb = "0.27"
# Used for QUIC Initial decryption (RFC 9001): HKDF-Expand-Label, AES-128-GCM
# AEAD, and AES-128-ECB header protection via `ring::aead::quic`. Already in
# the tree as a transitive dep of rustls; pinning explicitly so the QUIC
# crypto can't break under a transitive bump.
ring = "0.17"
# Global allocator. The default glibc `ptmalloc` retains freed chunks in
# per-thread arenas and can hold tens to a hundred MB of RSS that isn't
# logically in use, especially for long-running daemons that spawn short
# threads (which we do, per-collector tick). mimalloc trims aggressively
# and shaves a meaningful chunk off our steady-state baseline. Two-line
# wire-up: this dep + `#[global_allocator]` in src/main.rs.
mimalloc = { version = "0.1", default-features = false }
# Default: pulls in netwatch-sdk's BPF event source (Phase 1: a kprobe
# on `tcp_v4_connect`; Phase 2 adds its `tcp_v6_connect` twin), emitting
# per-(pid, comm, 5-tuple) connect events into a ring buffer for
# userspace. The SDK gates aya behind its own Linux target deps so this
# builds clean on macOS/Windows; the runtime path returns
# `EbpfError::UnsupportedPlatform` and we fall back to lsof/ss
# attribution. The Linux runtime path also gracefully falls back when
# the BPF object is missing or CAP_BPF/CAP_PERFMON aren't granted.
netwatch-sdk = { version = "0.4.0", features = ["ebpf"], optional = true }
# File-only structured logging. The TUI owns stdout/stderr in alternate-screen
# mode, so logs must never go to the terminal — they land in a daily-rotated
# file under the user's cache dir. Default level is WARN; users can override
# via `RUST_LOG=netwatch=debug` when handing us a repro for a stuck resolver,
# pcap startup failure, or remote-stream issue.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
# HTTP/3 response-body decompression for decrypted QUIC 1-RTT. Once a
# 1-RTT packet is decrypted, the H3 DATA-frame payload is usually gzip /
# deflate (flate2) or brotli (`br`) compressed; we sniff/trial-decompress
# rather than decode the QPACK-compressed Content-Encoding header. zstd
# deferred.
flate2 = "1"
brotli = "8"

[features]
# eBPF process attribution is on by default. The runtime gracefully
# downgrades to lsof/ss if the kernel won't load the BPF object (no
# CAP_BPF, kernel <5.10, non-Linux, BPF object not embedded into the
# SDK build), so users always get *some* attribution.
default = ["ebpf"]
ebpf = ["dep:netwatch-sdk"]

# Live eBPF IPv6-attribution smokes; reference the ebpf-only conn_tracker.
[[example]]
name = "ebpf_v6_smoke"
required-features = ["ebpf"]

[[example]]
name = "ebpf_udp_v6_smoke"
required-features = ["ebpf"]

[build-dependencies]
# Embeds a Windows application manifest (activeCodePage = UTF-8) so libpcap /
# Npcap device strings and error buffers in non-UTF-8 system locales decode as
# valid UTF-8 by the time the `pcap` crate sees them. Pure-Rust and a no-op
# unless the build target is Windows. See build.rs / issue #39.
embed-manifest = "1"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["net", "ioctl", "hostname", "uio", "poll"] }

# Phase 1 sandbox (Linux): drop CAP_NET_RAW / CAP_BPF / CAP_PERFMON after
# pcap + eBPF are up, then restrict filesystem and network via Landlock.
# Both crates are Linux-only — the sandbox module's macOS/Windows paths
# are stubs that report Disabled until Phase 2/3 land.
[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4"
caps = "0.5"

# ── Distro packages ───────────────────────────────────────────────────
#
# `cargo deb` and `cargo generate-rpm` build these from the already-compiled
# musl-static binary in CI (see .github/workflows/release.yml). Both install
# the same set: binary, three completions, the man page and the fleet-agent
# unit. Neither grants capabilities — see packaging/debian/postinst.
[package.metadata.deb]
name = "netwatch"
maintainer = "Matt Hartley <matthew.t.hartley@gmail.com>"
copyright = "2026, Matt Hartley"
license-file = ["LICENSE", "0"]
section = "net"
priority = "optional"
# The Linux release binaries are musl-static with libpcap linked in, so the
# package has no runtime dependencies at all. Left explicit: cargo-deb would
# otherwise run dpkg-shlibdeps and attach whatever the builder happened to
# link against, which is exactly the bug the static build fixed (#53).
depends = ""
extended-description = """\
Live per-connection throughput with application-protocol decoding, process \
attribution where the platform allows it, packet and interface views, and a \
diagnostic engine that learns a per-network baseline and opens an issue when \
that baseline breaks. Runs in a terminal, needs no configuration."""
maintainer-scripts = "packaging/debian/"
assets = [
    ["target/release/netwatch", "usr/bin/", "755"],
    ["completions/netwatch.bash", "usr/share/bash-completion/completions/netwatch", "644"],
    ["completions/_netwatch", "usr/share/zsh/site-functions/_netwatch", "644"],
    ["completions/netwatch.fish", "usr/share/fish/vendor_completions.d/netwatch.fish", "644"],
    ["docs/netwatch.1", "usr/share/man/man1/netwatch.1", "644"],
    ["packaging/systemd/netwatch.service", "usr/lib/systemd/system/netwatch.service", "644"],
    ["README.md", "usr/share/doc/netwatch/README.md", "644"],
    ["CHANGELOG.md", "usr/share/doc/netwatch/CHANGELOG.md", "644"],
]

[package.metadata.generate-rpm]
name = "netwatch"
summary = "Real-time network diagnostics in your terminal"
license = "MIT"
# Same reasoning as the deb: a static binary needs nothing, and letting the
# builder's own links leak into Requires is how a package breaks on a
# minimal host.
auto-req = "no"
post_install_script = "packaging/rpm/post_install.sh"
assets = [
    { source = "target/release/netwatch", dest = "/usr/bin/netwatch", mode = "755" },
    { source = "completions/netwatch.bash", dest = "/usr/share/bash-completion/completions/netwatch", mode = "644" },
    { source = "completions/_netwatch", dest = "/usr/share/zsh/site-functions/_netwatch", mode = "644" },
    { source = "completions/netwatch.fish", dest = "/usr/share/fish/vendor_completions.d/netwatch.fish", mode = "644" },
    { source = "docs/netwatch.1", dest = "/usr/share/man/man1/netwatch.1", mode = "644", doc = true },
    { source = "packaging/systemd/netwatch.service", dest = "/usr/lib/systemd/system/netwatch.service", mode = "644" },
    { source = "README.md", dest = "/usr/share/doc/netwatch/README.md", mode = "644", doc = true },
    { source = "CHANGELOG.md", dest = "/usr/share/doc/netwatch/CHANGELOG.md", mode = "644", doc = true },
    { source = "LICENSE", dest = "/usr/share/licenses/netwatch/LICENSE", mode = "644", doc = true },
]

# ── cargo-binstall ────────────────────────────────────────────────────
#
# `cargo binstall netwatch-tui` fetches the release binary instead of
# compiling, which also means it needs no libpcap headers. The release
# tarballs hold a binary named after its target (netwatch-linux-x86_64), not
# `netwatch`, so every override sets `bin-dir` to that name; without it
# binstall looks for `netwatch` inside the archive and fails.
#
# The gnu targets deliberately point at the musl asset: it is static, runs on
# a glibc host, and there is no separate gnu build to offer them.
[package.metadata.binstall]
disabled-strategies = ["quick-install", "compile"]

[package.metadata.binstall.overrides.x86_64-unknown-linux-musl]
pkg-url = "{ repo }/releases/download/v{ version }/netwatch-linux-x86_64.tar.gz"
bin-dir = "netwatch-linux-x86_64"

[package.metadata.binstall.overrides.x86_64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/netwatch-linux-x86_64.tar.gz"
bin-dir = "netwatch-linux-x86_64"

[package.metadata.binstall.overrides.aarch64-unknown-linux-musl]
pkg-url = "{ repo }/releases/download/v{ version }/netwatch-linux-aarch64.tar.gz"
bin-dir = "netwatch-linux-aarch64"

[package.metadata.binstall.overrides.aarch64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/netwatch-linux-aarch64.tar.gz"
bin-dir = "netwatch-linux-aarch64"

[package.metadata.binstall.overrides.x86_64-apple-darwin]
pkg-url = "{ repo }/releases/download/v{ version }/netwatch-macos-x86_64.tar.gz"
bin-dir = "netwatch-macos-x86_64"

[package.metadata.binstall.overrides.aarch64-apple-darwin]
pkg-url = "{ repo }/releases/download/v{ version }/netwatch-macos-aarch64.tar.gz"
bin-dir = "netwatch-macos-aarch64"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/netwatch-windows-x86_64.exe.zip"
bin-dir = "netwatch-windows-x86_64.exe"
