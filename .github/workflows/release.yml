name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.21.7). Re-runs the full build/publish pipeline against the given tag.'
        required: true
        type: string

# Read-only by default. The jobs that write say so: `release` (assets and
# attestations), `container` (the image) and `apt` (the gh-pages repo). The
# build jobs run third-party actions and compilers, and get no write scope.
permissions:
  contents: read

# `RELEASE_TAG` unifies the two trigger paths. On a tag push, GitHub sets
# `github.ref_name` to the tag (e.g. `v0.21.7`); on `workflow_dispatch`,
# `github.ref_name` is the branch, so we fall back to the manual input.
# Every job that needs the tag name reads from $RELEASE_TAG (or
# ${{ env.RELEASE_TAG }} in `uses:`/`with:` contexts).
env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  # Every other job needs this one, directly or through `build`. 0.32.2 and
  # 0.32.3 were both published from commits whose CI was red. A tag push
  # starts this workflow alongside CI, and nothing here waited for CI's
  # result. scripts/release.sh makes a commit and tag that pass the first
  # check.
  guard:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # `gh run list` reads CI's runs.
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}

      # The tag is Cargo.toml's version and has a CHANGELOG section, and every
      # ci.yml run on the tagged commit passed. The script waits up to five
      # minutes for CI to start and 30 for it to finish; tests/release.rs runs
      # it against a fake gh.
      - name: Tag is the release, and CI passed on it
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/release-guard.sh "${RELEASE_TAG}"

  build:
    needs: guard
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux ships musl-static only (issue #53): a dynamically-linked
          # glibc build needs the running system's libpcap to match what
          # the CI runner had, which a minimal distro or container usually
          # doesn't have installed. That is the exact failure the static
          # build was already added to solve — it just weakened the effect
          # by leaving both on the releases page with no signal for which
          # one to pick. There is now only one Linux binary, self-contained.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            name: netwatch-linux-x86_64
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            name: netwatch-linux-aarch64
          - target: x86_64-apple-darwin
            os: macos-latest
            name: netwatch-macos-x86_64
          - target: aarch64-apple-darwin
            os: macos-latest
            name: netwatch-macos-aarch64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            name: netwatch-windows-x86_64.exe
          # Not musl-static like the other Linux targets: Debian's armel
          # port (what Trixie ships for Marvell Kirkwood NAS boxes like
          # the Iomega ix2-dl) is glibc, and Ubuntu's runners have no armel
          # sysroot to build a musl target against. libpcap is still
          # static, so the only runtime dependency this binary picks up
          # beyond the other Linux builds is glibc itself.
          #
          # Built inside a `debian:bookworm` container, not on the
          # ubuntu-latest host directly, for two reasons:
          #
          # 1. glibc floor. Ubuntu 24.04's gcc-arm-linux-gnueabi links
          #    against glibc 2.39, which a Kirkwood box still on bookworm
          #    (glibc 2.36, a supported armel release) can't run.
          #
          # 2. time_t ABI. Do not bump this to trixie or a newer Ubuntu.
          #    Their armel gcc defaults to _TIME_BITS=64, which grows
          #    libpcap's `struct pcap_pkthdr` from 16 to 24 bytes and moves
          #    `caplen` from offset 8 to 16. Rust's `libc` crate still uses
          #    32-bit time_t on this target, so the `pcap` crate would read
          #    tv_usec as `caplen` and segfault seconds into a capture.
          #    Bookworm's gcc 12 predates Debian's 64-bit time_t switch. The
          #    build step asserts the 16-byte layout, so a toolchain change
          #    fails the release build instead of shipping a crashing binary.
          #
          # zig (cargo-zigbuild) was tried first, since it's already how
          # the musl targets pin an old glibc/musl floor -- rejected after
          # testing: zig's "generic" ARM baseline emits `bx lr`, which its
          # own assembler then rejects as an invalid instruction on this
          # architecture, and armv5te/arm926ej-s-specific cpu profiles are
          # missing the `__sync_*` atomic intrinsics parking_lot-alike
          # deps need -- the same wall the musl build already hit for this
          # target (see PR discussion).
          - target: armv5te-unknown-linux-gnueabi
            os: ubuntu-latest
            name: netwatch-linux-armv5te

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
      # armv5te builds entirely inside a debian:bookworm container (see the
      # matrix comment above), including its own rustup install, so the
      # host-level toolchain/cache setup below is skipped for it.
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        if: matrix.target != 'armv5te-unknown-linux-gnueabi'
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: matrix.target != 'armv5te-unknown-linux-gnueabi'
      # `cargo auditable` embeds the resolved dependency list in the binary
      # (a `.dep-v0` section), so `cargo audit bin`, Trivy and Syft can
      # check an installed netwatch without the SBOM beside it.
      - name: Install cargo-auditable
        if: matrix.target != 'armv5te-unknown-linux-gnueabi'
        uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-auditable@0.7.7

      - name: Install zig + cargo-zigbuild (Linux musl)
        if: contains(matrix.target, 'linux-musl')
        run: |
          python3 -m pip install --user ziglang cargo-zigbuild
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          case "${{ matrix.target }}" in
            x86_64-unknown-linux-musl)  TRIPLE=x86_64-linux-musl ;;
            aarch64-unknown-linux-musl) TRIPLE=aarch64-linux-musl ;;
          esac
          mkdir -p "$HOME/.local/bin"
          cat > "$HOME/.local/bin/${TRIPLE}-gcc" <<EOF
          #!/bin/sh
          exec python3 -m ziglang cc -target ${TRIPLE} "\$@"
          EOF
          cat > "$HOME/.local/bin/${TRIPLE}-ar" <<EOF
          #!/bin/sh
          exec python3 -m ziglang ar "\$@"
          EOF
          cat > "$HOME/.local/bin/${TRIPLE}-ranlib" <<EOF
          #!/bin/sh
          exec python3 -m ziglang ranlib "\$@"
          EOF
          chmod +x "$HOME/.local/bin/${TRIPLE}"-*
          echo "PCAP_CC=${TRIPLE}-gcc" >> $GITHUB_ENV
          echo "PCAP_HOST=${TRIPLE}" >> $GITHUB_ENV

      - name: Build static libpcap (Linux musl)
        if: contains(matrix.target, 'linux-musl')
        run: |
          LIBPCAP_VERSION=1.10.5
          PREFIX="${RUNNER_TEMP}/pcap-${{ matrix.target }}"
          wget -q https://www.tcpdump.org/release/libpcap-${LIBPCAP_VERSION}.tar.gz
          tar xzf libpcap-${LIBPCAP_VERSION}.tar.gz
          cd libpcap-${LIBPCAP_VERSION}
          CC="$PCAP_CC" ./configure \
            --host="$PCAP_HOST" \
            --prefix="$PREFIX" \
            --with-pcap=linux \
            --disable-shared \
            --disable-dbus \
            --disable-bluetooth \
            --disable-rdma \
            --disable-usb \
            --without-libnl
          make -j"$(nproc)"
          make install
          echo "LIBPCAP_LIBDIR=${PREFIX}/lib" >> $GITHUB_ENV
          echo "LIBPCAP_VER=${LIBPCAP_VERSION}" >> $GITHUB_ENV
          echo "PKG_CONFIG_PATH=${PREFIX}/lib/pkgconfig" >> $GITHUB_ENV
          echo "PKG_CONFIG_ALL_STATIC=1" >> $GITHUB_ENV
          echo "PKG_CONFIG_ALLOW_CROSS=1" >> $GITHUB_ENV

      - name: Install npcap SDK (Windows)
        if: runner.os == 'Windows'
        run: |
          ./scripts/npcap-sdk.ps1

      # netwatch-sdk 0.1.2+ ships the pre-built BPF object on crates.io, so
      # we no longer need to clone the SDK and run scripts/build-ebpf.sh
      # here — `cargo build` resolves the SDK from crates.io and the build.rs
      # picks up `pre-built/netwatch_sdk_ebpf.o` automatically. This also
      # means `cargo install netwatch-tui` now gets working eBPF too.

      - name: Build armv5te in debian:bookworm (Iomega ix2-dl / Marvell Kirkwood, Debian armel)
        if: matrix.target == 'armv5te-unknown-linux-gnueabi'
        run: |
          docker run --rm -v "$PWD:/work" debian:bookworm bash -c '
            set -ex
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq
            apt-get install -y -qq gcc-arm-linux-gnueabi flex bison curl build-essential ca-certificates pkg-config
            curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --default-toolchain stable --profile minimal -t armv5te-unknown-linux-gnueabi
            . "$HOME/.cargo/env"
            cargo install --locked cargo-auditable@0.7.7

            LIBPCAP_VERSION=1.10.5
            cd /tmp
            curl -sSLO https://www.tcpdump.org/release/libpcap-${LIBPCAP_VERSION}.tar.gz
            tar xzf libpcap-${LIBPCAP_VERSION}.tar.gz
            cd libpcap-${LIBPCAP_VERSION}
            CC=arm-linux-gnueabi-gcc ./configure \
              --host=arm-linux-gnueabi \
              --prefix=/tmp/pcap-out \
              --with-pcap=linux \
              --disable-shared \
              --disable-dbus \
              --disable-bluetooth \
              --disable-rdma \
              --disable-usb \
              --without-libnl
            make -j"$(nproc)"
            make install

            # libpcap must use the 32-bit time_t layout Rust expects on
            # this target. See the matrix comment for why.
            printf "%s\n" "#include <pcap/pcap.h>" \
              "_Static_assert(sizeof(struct pcap_pkthdr) == 16, \"pcap_pkthdr is not the 32-bit time_t layout Rust expects\");" \
              > /tmp/pkthdr_abi.c
            arm-linux-gnueabi-gcc -I/tmp/pcap-out/include -fsyntax-only /tmp/pkthdr_abi.c

            export CARGO_TARGET_ARMV5TE_UNKNOWN_LINUX_GNUEABI_LINKER=arm-linux-gnueabi-gcc
            # mimalloc-sys and ring compile C/asm sources from scratch, so
            # cc-rs needs to be told which cross compiler to use rather
            # than guessing from the host toolchain.
            export CC_armv5te_unknown_linux_gnueabi=arm-linux-gnueabi-gcc
            export AR_armv5te_unknown_linux_gnueabi=arm-linux-gnueabi-ar
            export LIBPCAP_LIBDIR=/tmp/pcap-out/lib
            # pcap cannot read the version of an ARM library from this
            # x86_64 host, so pin it like the musl builds do.
            export LIBPCAP_VER=${LIBPCAP_VERSION}
            cd /work
            cargo auditable build --release --target armv5te-unknown-linux-gnueabi
          '

      - name: Build
        if: matrix.target != 'armv5te-unknown-linux-gnueabi'
        shell: bash
        run: |
          if [[ "${{ matrix.target }}" == *"linux-musl" ]]; then
            cargo auditable zigbuild --release --target ${{ matrix.target }}
          else
            cargo auditable build --release --target ${{ matrix.target }}
          fi

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          cp target/${{ matrix.target }}/release/netwatch ${{ matrix.name }}
          tar czf ${{ matrix.name }}.tar.gz ${{ matrix.name }}

      # The check ci.yml makes, run on the binary about to be zipped. This
      # build adds `--target` and `cargo auditable`, which CI's does not. It
      # takes seconds and installs or writes nothing. A dispatch runs main's
      # copy of this file against the tag's tree, and tags before 0.38 have
      # no script (their CI never ran it either), so those skip the step.
      - name: Smoke-test the binary (Windows)
        if: runner.os == 'Windows' && hashFiles('scripts/windows-smoke.ps1') != ''
        shell: pwsh
        run: ./scripts/windows-smoke.ps1 target/${{ matrix.target }}/release/netwatch.exe

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          cp target/${{ matrix.target }}/release/netwatch.exe ${{ matrix.name }}
          Compress-Archive -Path ${{ matrix.name }} -DestinationPath ${{ matrix.name }}.zip

      # Distro packages for the two musl targets. Built from the binary the
      # step above produced (`--no-build`), so the .deb, the .rpm and the
      # tarball are the same bytes. `--no-strip`: the host `strip` on the
      # runner is x86_64 and would corrupt the aarch64 binary.
      - name: Install packaging tools
        if: contains(matrix.target, 'linux-musl')
        uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-deb,cargo-generate-rpm

      - name: Build .deb and .rpm
        if: contains(matrix.target, 'linux-musl')
        run: |
          # `--arch` is explicit: cargo-generate-rpm otherwise labels the
          # package with the host arch, so the aarch64 rpm would claim to be
          # x86_64 and dnf would install it on the wrong machine.
          case "${{ matrix.target }}" in
            x86_64-*)  rpm_arch=x86_64 ;;
            aarch64-*) rpm_arch=aarch64 ;;
            *) echo "no rpm arch mapping for ${{ matrix.target }}"; exit 1 ;;
          esac
          cargo deb --no-build --no-strip --target ${{ matrix.target }} --output .
          cargo generate-rpm --target ${{ matrix.target }} --arch "${rpm_arch}" --output .
          ls -l *.deb *.rpm

      # A package that installs but does not run is worse than no package.
      # x86_64 only: the runner cannot execute the aarch64 binary, so that
      # one is checked for contents alone.
      - name: Verify packages install
        if: contains(matrix.target, 'linux-musl')
        run: |
          set -eux
          deb=$(ls *.deb)
          dpkg-deb --contents "${deb}" | grep -q 'usr/bin/netwatch'
          dpkg-deb --contents "${deb}" | grep -q 'man1/netwatch.1'
          dpkg-deb --contents "${deb}" | grep -q 'bash-completion/completions/netwatch'
          if [ "${{ matrix.target }}" = "x86_64-unknown-linux-musl" ]; then
            sudo dpkg -i "${deb}"
            netwatch --version
            test -f /usr/share/man/man1/netwatch.1.gz
            test -f /usr/share/zsh/site-functions/_netwatch
            # The package must not grant capabilities behind the admin's back.
            if command -v getcap >/dev/null && [ -n "$(getcap /usr/bin/netwatch)" ]; then
              echo "package granted capabilities; postinst should only print them"; exit 1
            fi
            sudo dpkg -r netwatch
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.name }}
          path: |
            ${{ matrix.name }}.tar.gz
            ${{ matrix.name }}.zip
            *.deb
            *.rpm

  # Can't join the `build` matrix above: none of its cross-compile paths
  # (cargo-zigbuild, the armv5te debian:bookworm container, or the host
  # toolchain directly) link against FreeBSD's libc. This builds for real,
  # inside a FreeBSD VM — same approach as the `freebsd` job in ci.yml.
  #
  # The VM release is pinned to the oldest one we support (issue #63). FreeBSD
  # binaries cannot be static: they link the host's libc, and one built on a
  # newer release asks for symbol versions an older one lacks ("FBSD_1.9 not
  # found"). Symbol versions only ever grow, so a 13.x build runs on 13, 14
  # and 15. Do not bump this to follow the latest release; that is the bug.
  # (13.5 is EOL upstream; move to 14.x only when dropping 13 in the README.)
  #
  # libpcap comes from the base system on purpose, so it is NOT pkg-installed:
  # the ports libpcap lives in /usr/local/lib and would make the binary
  # depend on a package the user may not have.
  #
  # Best-effort: `continue-on-error` keeps a FreeBSD VM hiccup from blocking
  # the other platforms; `release` then simply ships without this asset.
  build-freebsd:
    needs: guard
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Build inside a FreeBSD 13 VM
        uses: vmactions/freebsd-vm@c46abacb49f09938ca4e1702d15d836285d694cc # v1.5.9
        with:
          release: "13.5"
          usesh: true
          # FreeBSD 13's package repository is gone (13.x is end of life),
          # so `pkg install rust` 404s. rustup still ships FreeBSD
          # toolchains, and libpcap comes from the base system, so the
          # binary still runs on FreeBSD 13 and later.
          prepare: |
            # The rustup-init binary, not sh.rustup.rs: that script needs
            # curl or wget, and the base system has only fetch(1).
            fetch -o /tmp/rustup-init https://static.rust-lang.org/rustup/dist/x86_64-unknown-freebsd/rustup-init
            chmod +x /tmp/rustup-init
            /tmp/rustup-init -y --profile minimal
            . "$HOME/.cargo/env"
            cargo install --locked cargo-auditable@0.7.7
          run: |
            set -ex
            . "$HOME/.cargo/env"
            freebsd-version
            cargo auditable build --release
            ./target/release/netwatch --version
            # Record what the binary needs from the host. Anything under
            # /usr/local would mean a ports dependency leaked in.
            ldd target/release/netwatch
            ! ldd target/release/netwatch | grep -q /usr/local
            cp target/release/netwatch netwatch-freebsd-x86_64
            tar czf netwatch-freebsd-x86_64.tar.gz netwatch-freebsd-x86_64

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: netwatch-freebsd-x86_64
          path: netwatch-freebsd-x86_64.tar.gz

  release:
    needs: [build, build-freebsd]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Build provenance: `id-token` signs the attestation, `attestations`
      # records it against the repository so `gh attestation verify` works.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          merge-multiple: true

      # Every shipped binary must carry the dependency list `cargo auditable`
      # embeds. A build step that lost the wrapper still links fine, so
      # check the artifacts rather than trust the build.
      - name: Install rust-audit-info
        uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: rust-audit-info@0.5.4
      - name: Check every binary is auditable
        run: |
          set -euo pipefail
          shopt -s nullglob
          dir=$(mktemp -d)
          n=0
          for a in *.tar.gz; do tar xzf "$a" -C "$dir"; done
          for a in *.zip; do unzip -q -o "$a" -d "$dir"; done
          for bin in "$dir"/netwatch-*; do
            pkgs=$(rust-audit-info "$bin" | jq '.packages | length')
            echo "$(basename "$bin"): $pkgs packages"
            [ "$pkgs" -gt 1 ]
            n=$((n + 1))
          done
          [ "$n" -gt 0 ]

      # One file, `sha256sum -c` format, so a downloader can verify without
      # trusting this page: `sha256sum --ignore-missing -c SHA256SUMS`.
      # Downstream packagers (AUR, nixpkgs, COPR) need these hashes too and
      # were previously computing them from an unverified download.
      - name: Generate SHA256SUMS
        run: |
          shopt -s nullglob
          sha256sum *.tar.gz *.zip *.deb *.rpm | sort -k2 > SHA256SUMS
          cat SHA256SUMS

      # Signed provenance tying each artifact to this workflow, commit and
      # runner. Verified with:
      #   gh attestation verify netwatch-linux-x86_64.tar.gz -R matthart1983/netwatch
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            *.tar.gz
            *.zip
            *.deb
            *.rpm

      # The dependency list every binary was built from, as CycloneDX JSON
      # from Cargo.lock, attached to the release and attested against each
      # artifact. Verified with:
      #   gh attestation verify netwatch-linux-x86_64.tar.gz -R matthart1983/netwatch \
      #     --predicate-type https://cyclonedx.org/bom
      - name: Install cargo-cyclonedx
        uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-cyclonedx
      - name: Generate the SBOM
        id: sbom
        run: |
          cargo cyclonedx --format json --spec-version 1.5 --all-features --override-filename netwatch.cdx
          mv netwatch.cdx.json "netwatch-${RELEASE_TAG#v}.cdx.json"
          echo "path=netwatch-${RELEASE_TAG#v}.cdx.json" >> "$GITHUB_OUTPUT"
      - name: Attest the SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: |
            *.tar.gz
            *.zip
            *.deb
            *.rpm
          # A literal path: attest-sbom reads it with open(), no globbing.
          sbom-path: ${{ steps.sbom.outputs.path }}

      - name: Create Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          # A tag with a hyphen (v0.33.0-rc.1) is a pre-release: GitHub keeps
          # /releases/latest pointing at the last real one, so Scoop's
          # checkver and anyone scripting against `latest` do not pick it up.
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
          # When dispatched manually, github.ref is a branch, so be
          # explicit about which tag this release attaches to.
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            *.tar.gz
            *.zip
            *.deb
            *.rpm
            SHA256SUMS
            netwatch-*.cdx.json

  # Multi-arch image from the binaries the build job already produced, so the
  # image, the tarball and the .deb are the same bytes. Pre-release tags get
  # their version tag but never `:latest`.
  container:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Provenance for the image, stored in the registry beside it.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          merge-multiple: true

      - name: Lay out the build context
        run: |
          set -eux
          mkdir -p packaging/docker/bin
          tar xzf netwatch-linux-x86_64.tar.gz
          tar xzf netwatch-linux-aarch64.tar.gz
          mv netwatch-linux-x86_64 packaging/docker/bin/netwatch-amd64
          mv netwatch-linux-aarch64 packaging/docker/bin/netwatch-arm64
          chmod +x packaging/docker/bin/netwatch-*

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: packaging/docker
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ env.RELEASE_TAG }}
            ${{ contains(env.RELEASE_TAG, '-') && '' || format('ghcr.io/{0}:latest', github.repository) }}

      # The image's provenance, pushed to GHCR next to it. Verified with:
      #   gh attestation verify oci://ghcr.io/matthart1983/netwatch:vX.Y.Z -R matthart1983/netwatch
      - name: Attest the image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  # Publish an apt repository on GitHub Pages, built from the .deb files the
  # build job produced. Self-hosted rather than a Launchpad PPA on purpose:
  # the packages hold a musl-static binary, so they install on any Debian or
  # Ubuntu, while a PPA would build from source against whatever Rust that
  # release ships (24.04 LTS is on 1.75, too old for this crate).
  apt:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          merge-multiple: true

      - name: Check out the published repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: gh-pages
          path: pages
        continue-on-error: true

      - name: Build the apt tree
        run: |
          set -eux
          # Keep whatever is already published: apt clients pin versions, and
          # dropping older debs breaks anyone holding one back.
          mkdir -p pages/apt/pool/main pages/apt/dists/stable/main/binary-amd64 \
                   pages/apt/dists/stable/main/binary-arm64
          cp -f *.deb pages/apt/pool/main/
          cp -f packaging/apt/netwatch-archive-keyring.gpg pages/apt/netwatch.gpg

          cd pages/apt
          for arch in amd64 arm64; do
            apt-ftparchive --arch "${arch}" packages pool/main \
              > "dists/stable/main/binary-${arch}/Packages"
            gzip -9fk "dists/stable/main/binary-${arch}/Packages"
          done
          apt-ftparchive \
            -o APT::FTPArchive::Release::Origin=netwatch \
            -o APT::FTPArchive::Release::Label=netwatch \
            -o APT::FTPArchive::Release::Suite=stable \
            -o APT::FTPArchive::Release::Codename=stable \
            -o APT::FTPArchive::Release::Architectures="amd64 arm64" \
            -o APT::FTPArchive::Release::Components=main \
            release dists/stable > dists/stable/Release

      - name: Sign the release index
        env:
          KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
          KEY_ID: ${{ secrets.APT_GPG_KEY_ID }}
        run: |
          set -eu
          if [ -z "${KEY}" ]; then
            echo "APT_GPG_PRIVATE_KEY not set — skipping the apt repository"
            echo "APT_SIGNED=false" >> "${GITHUB_ENV}"
            exit 0
          fi
          echo "APT_SIGNED=true" >> "${GITHUB_ENV}"
          echo "${KEY}" | gpg --batch --import
          cd pages/apt
          # Detached (Release.gpg) for older clients, inline (InRelease) for
          # current ones; apt prefers InRelease and falls back.
          gpg --batch --yes --local-user "${KEY_ID}" -abs \
            -o dists/stable/Release.gpg dists/stable/Release
          gpg --batch --yes --local-user "${KEY_ID}" --clearsign \
            -o dists/stable/InRelease dists/stable/Release

      - name: Publish
        if: env.APT_SIGNED == 'true'
        run: |
          set -eux
          cd pages
          test -f apt/dists/stable/InRelease
          git init -q -b gh-pages 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" 2>/dev/null || true
          # Jekyll would eat directories beginning with an underscore and add
          # nothing here.
          touch .nojekyll
          git add -A
          git commit -qm "apt: netwatch ${RELEASE_TAG}" || { echo "nothing to publish"; exit 0; }
          git push -q --force origin gh-pages

  # Ask COPR to rebuild from the tag. A webhook would do the same, but this
  # keeps the trigger in the workflow where the rest of the release lives, and
  # skips cleanly when the secrets are absent.
  copr:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Trigger a COPR build
        env:
          COPR_LOGIN: ${{ secrets.COPR_LOGIN }}
          COPR_TOKEN: ${{ secrets.COPR_TOKEN }}
          COPR_USERNAME: ${{ secrets.COPR_USERNAME }}
        run: |
          if [ -z "${COPR_LOGIN}" ]; then
            echo "COPR secrets not configured — skipping (see docs/PACKAGING.md)"
            exit 0
          fi
          curl -sSf -u "${COPR_LOGIN}:${COPR_TOKEN}" \
            -X POST https://copr.fedorainfracloud.org/api_3/package/build \
            -F "ownername=${COPR_USERNAME}" \
            -F "projectname=netwatch" \
            -F "package_name=netwatch" | head -c 400

  publish:
    needs: release
    runs-on: ubuntu-latest
    # Allow re-running on a tag that's already on crates.io — manual
    # dispatches will often hit this since `cargo publish` is immutable.
    # Skip cleanly instead of failing the whole workflow.
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install libpcap
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev

      - name: Publish to crates.io (skip if already published)
        run: |
          VERSION="${RELEASE_TAG#v}"
          # `cargo publish` refuses a version that is already on crates.io —
          # match that and exit 0 so re-dispatches and release candidates stay
          # green. The wording has changed once already ("crate version is
          # already uploaded" became "already exists on crates.io index"), so
          # both spellings are matched; a v0.33.0-rc.1 run failed on exactly
          # that.
          # IMPORTANT: read PIPESTATUS, not $? — piping through `tee` would
          # otherwise hide cargo's exit code (tee always succeeds) and the
          # step would falsely report "Published OK" on real failures like
          # 403 auth errors. Found while backfilling v0.21.6 — silent
          # success masked an invalid CARGO_REGISTRY_TOKEN.
          cargo publish 2>&1 | tee /tmp/publish.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -eq 0 ]; then
            echo "Published OK"
          elif grep -qE "already (uploaded|exists on crates.io)" /tmp/publish.log; then
            echo "v${VERSION} already on crates.io — skipping"
          else
            echo "Publish failed (cargo exit $rc) for a reason other than 'already uploaded'"
            exit 1
          fi
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
