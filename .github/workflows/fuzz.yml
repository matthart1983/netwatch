name: Fuzz

# Coverage-guided fuzzing of the parsers that capture traffic reaches
# (fuzz/fuzz_targets). Briefly on every pull request that touches code, for
# longer every week. The corpus each run grows is cached and seeds the next,
# so the weekly run keeps going deeper rather than starting over.
on:
  pull_request:
    branches: [main]
    paths: ["src/**", "fuzz/**", "Cargo.lock", ".github/workflows/fuzz.yml"]
  schedule:
    - cron: "15 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [frame, classify, tls_handshake, quic_initial, http3, display_filter]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch; toolchain from input
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: fuzz
      - name: Install libpcap and cargo-fuzz
        run: |
          sudo apt-get update && sudo apt-get install -y libpcap-dev
          cargo install cargo-fuzz --locked

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-

      # 60 s on a pull request, 10 min on the weekly run. -rss_limit_mb keeps a
      # memory blow-up (a decompression bomb, an unbounded resize) a failure
      # rather than a runner kill.
      - name: Fuzz ${{ matrix.target }}
        run: |
          secs=60
          [ "${{ github.event_name }}" = pull_request ] || secs=600
          cargo fuzz run ${{ matrix.target }} -- -max_total_time=$secs -rss_limit_mb=2048 -max_len=65536

      - name: Upload the crashing input
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-${{ matrix.target }}-artifacts
          path: fuzz/artifacts/${{ matrix.target }}
