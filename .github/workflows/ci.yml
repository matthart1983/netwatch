name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Read-only token for every job: nothing here writes to the repository.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check documentation and wiki links
        run: python3 scripts/wiki.py --check
      - name: Test documentation checks
        run: python3 -m unittest discover -s tests/docs -v
      - name: Render release-baseline wiki without publishing
        run: python3 scripts/wiki.py --output "${{ runner.temp }}/netwatch-wiki" --ref HEAD

  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install libpcap (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev

      - name: Install npcap SDK (Windows)
        if: runner.os == 'Windows'
        run: |
          ./scripts/npcap-sdk.ps1

      - name: Check formatting
        run: cargo fmt --check

      # `-D`, not `-W`. Warnings that never fail anything accumulate until
      # nobody reads them — this repo had 54 before they were cleared, which
      # is exactly enough noise to hide a real one. Lints that are genuinely
      # not worth following are declared as `#![allow]` with a reason at the
      # top of src/lib.rs, so a warning reaching CI now means something new.
      #
      # The trade: the toolchain is unpinned `stable`, and every Rust release
      # adds lints, so a bump can turn this red with no code change. That is
      # the intended failure — a new lint is worth an hour — but it means a red
      # clippy job on an untouched branch is a toolchain bump, not a
      # regression. Check `rustc --version` before hunting for a cause.
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        run: cargo build --release

      # The tests never start the binary this job just built. The runner has
      # the Npcap SDK but not Npcap, like a new user's machine, so check what
      # that user meets first. `--version` and `doctor` must run, and doctor
      # must say Npcap is missing and where to get it.
      - name: Smoke-test the release binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/windows-smoke.ps1 target\release\netwatch.exe

      - name: Install cargo-nextest
        uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-nextest

      # nextest, not `cargo test`: .config/nextest.toml retries only the tests
      # whose outcome depends on the runner, and a pass on retry is reported
      # as FLAKY instead of hiding. The crate has no doctests to lose.
      - name: Test
        run: cargo nextest run --profile ci

      # A flaky pass is still a pass, so say so where it will be seen: one
      # warning per test, on the run's summary page.
      - name: Report flaky tests
        if: always()
        shell: bash
        run: |
          f=target/nextest/ci/junit.xml
          [ -f "$f" ] || exit 0
          python3 - "$f" <<'PY'
          import sys, xml.etree.ElementTree as ET
          for case in ET.parse(sys.argv[1]).iter("testcase"):
              if case.find("flakyFailure") is not None:
                  print(f"::warning title=Flaky test::{case.get('classname')} {case.get('name')} passed only on retry")
          PY

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-${{ matrix.os }}
          path: target/nextest/ci/junit.xml
          if-no-files-found: ignore

  # Every release tag has to be on main, so a hotfix released from a
  # release/X.Y.Z branch cannot be left behind by the next release from main
  # (see scripts/tags-on-main.sh). Not on a manual run: `gh workflow run
  # ci.yml --ref vX.Y.Z` tests a hotfix tag, whose branch can predate a later
  # tag on main.
  tags-on-main:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check every release tag is on main
        run: scripts/tags-on-main.sh
  # Advisories, licenses and sources for every dependency, per deny.toml. A
  # new RustSec advisory turns this red with no code change, which is the
  # point: the fix is an upgrade, or an ignore with a reason in deny.toml.
  cargo-deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
  # The declared rust-version still builds. Without this, `rust-version` in
  # Cargo.toml is a guess: the test matrix uses the latest stable, which
  # accepts code that an older compiler a distro ships would reject.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read rust-version from Cargo.toml
        id: msrv
        run: echo "version=$(grep -m1 '^rust-version' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch; toolchain from input
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install libpcap
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev
      - name: cargo check on the minimum supported Rust
        run: cargo check --all-targets --locked

  # The Diagnose fault lab builds a two-namespace veth network and asserts the
  # probe's verdicts against faults it creates on purpose: IPv6 blackholes, a
  # captive portal, a PMTU hole, a seccomp-denied socket, TIME_WAIT pressure.
  # It existed in the repo for weeks with nothing running it, which makes it a
  # test that cannot fail. Privileges: a user namespace mapped to root, so
  # nothing outside the job's own namespace is touched.
  diagnose-fault-lab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install libpcap and lab tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libpcap-dev iproute2 ethtool iputils-ping util-linux

      - name: Build the probe example
        run: cargo build --example diagnose_probe

      # The same AppArmor restriction the health lab lifts: without this the
      # unshare below is refused, and before pipefail the tee hid that, so
      # this job was green without ever running the lab.
      - name: Allow unprivileged user namespaces
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Run the fault lab
        shell: bash
        run: |
          set -o pipefail
          unshare --user --map-root-user --net python3 tests/diagnose/fault_lab.py | tee fault-lab.json

      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diagnose-fault-lab
          path: fault-lab.json
          if-no-files-found: warn

  # Decision D6 runs the health lab's --quick on pull requests that touch what
  # it tests. A push to main or a manual run always runs it, so the commit a
  # release is tagged on has a result, and the release guard, which waits on
  # every ci.yml run on that commit, holds the tag until the lab passes. It is
  # a job here rather than a path filter in health-lab.yml for that reason.
  health-lab-scope:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.scope.outputs.run }}
    steps:
      # A pull request checks out its merge commit, whose first parent is the
      # base, so the diff against that parent is the pull request's change.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      # The file list goes through a variable: under pipefail, grep -q
      # closing a pipe early would fail `git diff` and read as no match.
      - name: Decide whether the change touches the health lab
        id: scope
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
        run: |
          run=true
          if [ "${EVENT}" = pull_request ]; then
            changed=$(git diff --name-only HEAD^1 HEAD)
            grep -qE '^(src/diagnose/|src/collectors/health\.rs$|tests/diagnose/|examples/diagnose_lab\.rs$|\.github/workflows/(ci|health-lab)\.yml$)' \
              <<< "${changed}" || run=false
          fi
          echo "run=${run}" | tee -a "${GITHUB_OUTPUT}"

  diagnose-health-lab:
    needs: health-lab-scope
    if: needs.health-lab-scope.outputs.run == 'true'
    uses: ./.github/workflows/health-lab.yml
    with:
      set: quick
