name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Read-only token for every job: nothing here writes to the repository.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install libpcap (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev

      - name: Install npcap SDK (Windows)
        if: runner.os == 'Windows'
        run: |
          Invoke-WebRequest -Uri "https://npcap.com/dist/npcap-sdk-1.13.zip" -OutFile npcap-sdk.zip
          Expand-Archive -Path npcap-sdk.zip -DestinationPath npcap-sdk
          echo "LIB=${{ github.workspace }}\npcap-sdk\Lib\x64" >> $env:GITHUB_ENV

      - name: Check formatting
        run: cargo fmt --check

      # `-D`, not `-W`. Warnings that never fail anything accumulate until
      # nobody reads them — this repo had 54 before they were cleared, which
      # is exactly enough noise to hide a real one. Lints that are genuinely
      # not worth following are declared as `#![allow]` with a reason at the
      # top of src/lib.rs, so a warning reaching CI now means something new.
      #
      # The trade: the toolchain is unpinned `stable`, and every Rust release
      # adds lints, so a bump can turn this red with no code change. That is
      # the intended failure — a new lint is worth an hour — but it means a red
      # clippy job on an untouched branch is a toolchain bump, not a
      # regression. Check `rustc --version` before hunting for a cause.
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        run: cargo build --release

      - name: Test
        run: cargo test

  # Every release tag has to be on main, so a hotfix released from a
  # release/X.Y.Z branch cannot be left behind by the next release from main
  # (see scripts/tags-on-main.sh). Not on a manual run: `gh workflow run
  # ci.yml --ref vX.Y.Z` tests a hotfix tag, whose branch can predate a later
  # tag on main.
  tags-on-main:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Check every release tag is on main
        run: scripts/tags-on-main.sh
  # Advisories, licenses and sources for every dependency, per deny.toml. A
  # new RustSec advisory turns this red with no code change, which is the
  # point: the fix is an upgrade, or an ignore with a reason in deny.toml.
  cargo-deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check

  # No hosted FreeBSD runner exists, and cross-rs doesn't support FreeBSD, so
  # this boots a real FreeBSD VM via QEMU on the ubuntu-latest host — the
  # standard way Rust projects get genuine FreeBSD CI. Slower than the native
  # matrix jobs above (no package cache survives the VM boundary, so every
  # run compiles every dependency from scratch) and intentionally
  # lighter-weight: fmt/clippy are already enforced in `test`, so this job
  # only proves the FreeBSD-specific code (src/platform/freebsd.rs, the
  # sockstat connection parser, the sysctl-based procname lookup) actually
  # builds and its tests pass on the real OS.
  freebsd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Build and test on FreeBSD
        uses: vmactions/freebsd-vm@c46abacb49f09938ca4e1702d15d836285d694cc # v1.5.9
        with:
          usesh: true
          prepare: |
            pkg install -y rust libpcap pkgconf
          run: |
            cargo build
            cargo test

  # Only the release workflow actually builds for armv5te (Iomega ix2-dl /
  # Marvell Kirkwood), and that only runs on a tag push. Without this, a
  # change like re-introducing an AtomicU64 (armv5te has no native 64-bit
  # atomics) would stay green here and only surface as a broken release
  # build days or weeks later, on a tag. A `check` catches the same class
  # of regression without paying for a full cross build on every push.
  armv5te-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: armv5te-unknown-linux-gnueabi
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install armv5te cross-compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-linux-gnueabi
          echo "CARGO_TARGET_ARMV5TE_UNKNOWN_LINUX_GNUEABI_LINKER=arm-linux-gnueabi-gcc" >> $GITHUB_ENV
          # mimalloc-sys and ring compile C/asm sources from scratch, so
          # cc-rs needs to be told which cross compiler to use rather than
          # guessing from the host toolchain.
          echo "CC_armv5te_unknown_linux_gnueabi=arm-linux-gnueabi-gcc" >> $GITHUB_ENV
          echo "AR_armv5te_unknown_linux_gnueabi=arm-linux-gnueabi-ar" >> $GITHUB_ENV
          # `cargo check` never links, so the `pcap` crate's build.rs only
          # needs a LIBPCAP_LIBDIR to point at -- given one, it tries to
          # load a library there to read its version and falls back to
          # assuming the latest on failure, which is exactly what happens
          # here (there's nothing at this path, and it's an x86_64 host
          # trying to load an ARM library either way). No real libpcap
          # build needed for a check-only job.
          echo "LIBPCAP_LIBDIR=/tmp" >> $GITHUB_ENV

      - name: cargo check armv5te
        run: cargo check --target armv5te-unknown-linux-gnueabi

  # The Diagnose fault lab builds a two-namespace veth network and asserts the
  # probe's verdicts against faults it creates on purpose: IPv6 blackholes, a
  # captive portal, a PMTU hole, a seccomp-denied socket, TIME_WAIT pressure.
  # It existed in the repo for weeks with nothing running it, which makes it a
  # test that cannot fail. Privileges: a user namespace mapped to root, so
  # nothing outside the job's own namespace is touched.
  diagnose-fault-lab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install libpcap and lab tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libpcap-dev iproute2 ethtool iputils-ping util-linux

      - name: Build the probe example
        run: cargo build --example diagnose_probe

      # The same AppArmor restriction the health lab lifts: without this the
      # unshare below is refused, and before pipefail the tee hid that, so
      # this job was green without ever running the lab.
      - name: Allow unprivileged user namespaces
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Run the fault lab
        shell: bash
        run: |
          set -o pipefail
          unshare --user --map-root-user --net python3 tests/diagnose/fault_lab.py | tee fault-lab.json

      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: diagnose-fault-lab
          path: fault-lab.json
          if-no-files-found: warn

  # Decision D6 runs the health lab's --quick on pull requests that touch what
  # it tests. A push to main or a manual run always runs it, so the commit a
  # release is tagged on has a result, and the release guard, which waits on
  # every ci.yml run on that commit, holds the tag until the lab passes. It is
  # a job here rather than a path filter in health-lab.yml for that reason.
  health-lab-scope:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.scope.outputs.run }}
    steps:
      # A pull request checks out its merge commit, whose first parent is the
      # base, so the diff against that parent is the pull request's change.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 2

      # The file list goes through a variable: under pipefail, grep -q
      # closing a pipe early would fail `git diff` and read as no match.
      - name: Decide whether the change touches the health lab
        id: scope
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
        run: |
          run=true
          if [ "${EVENT}" = pull_request ]; then
            changed=$(git diff --name-only HEAD^1 HEAD)
            grep -qE '^(src/diagnose/|src/collectors/health\.rs$|tests/diagnose/|examples/diagnose_lab\.rs$|\.github/workflows/(ci|health-lab)\.yml$)' \
              <<< "${changed}" || run=false
          fi
          echo "run=${run}" | tee -a "${GITHUB_OUTPUT}"

  diagnose-health-lab:
    needs: health-lab-scope
    if: needs.health-lab-scope.outputs.run == 'true'
    uses: ./.github/workflows/health-lab.yml
    with:
      set: quick
